<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>THE APEX 99 | WHO IS THE ONE</title>

<meta name="description" content="THE APEX 99 - Events, Tours, Academy, Adventure and Media">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#050505;
    color:#fff;
    overflow-x:hidden;
}

:root{
    --gold:#f4b51c;
    --gold2:#ffd75b;
    --black:#030303;
    --dark:#0b0b0b;
    --gray:#aaa;
}

a{
    text-decoration:none;
    color:inherit;
}

button{
    font-family:inherit;
}

img{
    max-width:100%;
}

/* ================= HEADER ================= */

.header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:76px;
    background:rgba(0,0,0,.94);
    border-bottom:1px solid rgba(244,181,28,.45);
    z-index:9999;
    backdrop-filter:blur(12px);
}

.header-inner{
    width:95%;
    max-width:1450px;
    height:100%;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:190px;
}

.logo-symbol{
    width:50px;
    height:55px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold);
    font-size:39px;
    font-weight:900;
    font-style:italic;
    position:relative;
}

.logo-symbol:before{
    content:"";
    position:absolute;
    width:31px;
    height:31px;
    border-left:4px solid var(--gold);
    border-top:4px solid var(--gold);
    transform:rotate(45deg);
}

.logo-name{
    font-size:15px;
    font-weight:bold;
    letter-spacing:.5px;
}

.logo-tag{
    font-size:6px;
    color:#bbb;
    letter-spacing:2px;
    margin-top:5px;
}

.nav{
    display:flex;
    align-items:center;
    gap:2px;
}

.nav a{
    padding:11px 13px;
    font-size:11px;
    color:#eee;
    border-radius:6px;
    transition:.3s;
}

.nav a:hover,
.nav a.active{
    background:linear-gradient(135deg,#654a0b,#dba617);
    color:#fff;
}

.header-contact{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
}

.unit{
    font-size:7px;
    color:#aaa;
    letter-spacing:1px;
    margin-bottom:4px;
}

.whatsapp{
    background:linear-gradient(135deg,#ffd24c,#9b6900);
    color:#000;
    padding:7px 13px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
}

.menu{
    display:none;
    width:42px;
    height:38px;
    border:1px solid var(--gold);
    background:#080808;
    color:var(--gold);
    border-radius:6px;
    font-size:21px;
}

/* ================= HERO ================= */

.hero{
    margin-top:76px;
    height:calc(100vh - 76px);
    min-height:590px;
    max-height:780px;
    position:relative;
    overflow:hidden;
}

.slide{
    position:absolute;
    inset:0;
    opacity:0;
    transform:scale(1.04);
    transition:opacity 1s ease,transform 5s ease;
    background-size:cover;
    background-position:center;
}

.slide.active{
    opacity:1;
    transform:scale(1);
}

.slide:after{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(90deg,
        rgba(0,0,0,.88),
        rgba(0,0,0,.48),
        rgba(0,0,0,.18)),
        linear-gradient(0deg,
        rgba(0,0,0,.8),
        transparent 55%);
}

/* REAL ONLINE IMAGES */

.slide1{
    background-image:url("https://www.nathanhortonphotography.com/wp-content/uploads/2023/01/Kashmir.jpg");
}

.slide2{
    background-image:url("https://media.bolatimes.com/thumbs/2022/06/24/84897-timnas-india/730x480-img-84897-timnas-india.jpg");
}

.slide3{
    background-image:url("https://www.pelago.com/img/products/IN-India/72-hours-jungle-survival-learn-to-thrive/f201a080-4a4e-41bb-9329-94e8f49f7e91_72-hours-jungle-survival-learn-to-thrive-xlarge.jpg");
}

.hero-content{
    position:relative;
    z-index:2;
    width:90%;
    max-width:1300px;
    height:100%;
    margin:auto;
    display:flex;
    align-items:center;
}

.hero-text{
    max-width:590px;
}

.hand{
    color:var(--gold);
    font-family:cursive;
    font-style:italic;
    font-size:clamp(40px,6vw,78px);
    transform:rotate(-5deg);
    display:inline-block;
}

.hero h1{
    font-size:clamp(48px,7vw,90px);
    line-height:.9;
    margin:5px 0 20px;
    text-transform:uppercase;
    letter-spacing:2px;
    text-shadow:4px 5px 12px #000;
}

.hero h1 span{
    color:var(--gold);
}

.hero-sub{
    font-size:13px;
    letter-spacing:3px;
    font-weight:bold;
    margin-bottom:15px;
}

.hero-text p{
    font-size:16px;
    line-height:1.6;
    color:#ddd;
    font-style:italic;
    max-width:430px;
}

.gold-btn{
    display:inline-flex;
    margin-top:25px;
    padding:12px 22px;
    border:1px solid var(--gold);
    border-radius:30px;
    background:rgba(0,0,0,.5);
    color:#fff;
    font-size:11px;
    font-weight:bold;
    transition:.3s;
}

.gold-btn:hover{
    background:var(--gold);
    color:#000;
}

.hero-arrow{
    position:absolute;
    z-index:5;
    top:50%;
    transform:translateY(-50%);
    width:43px;
    height:43px;
    border:1px solid #fff;
    border-radius:50%;
    background:rgba(0,0,0,.45);
    color:#fff;
    cursor:pointer;
    font-size:23px;
}

.hero-arrow:hover{
    color:var(--gold);
    border-color:var(--gold);
}

.prev{
    left:20px;
}

.next{
    right:20px;
}

.dots{
    position:absolute;
    z-index:5;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:8px;
}

.dot{
    width:9px;
    height:9px;
    border:1px solid #fff;
    border-radius:50%;
    background:transparent;
    cursor:pointer;
}

.dot.active{
    background:var(--gold);
    border-color:var(--gold);
}

/* ================= STATS ================= */

.stats{
    background:#050505;
    border-top:1px solid rgba(244,181,28,.4);
    border-bottom:1px solid rgba(244,181,28,.4);
}

.stats-inner{
    max-width:1250px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(5,1fr);
}

.stat{
    min-height:105px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    border-right:1px solid rgba(244,181,28,.3);
}

.stat:last-child{
    border-right:none;
}

.stat-icon{
    font-size:24px;
    color:var(--gold);
    margin-bottom:5px;
}

.stat strong{
    font-size:18px;
}

.stat span{
    font-size:8px;
    color:#999;
    letter-spacing:1px;
    margin-top:4px;
}

/* ================= COMMON ================= */

.section{
    padding:55px 20px;
    background:
    radial-gradient(circle at 50% 0%,rgba(244,181,28,.08),transparent 35%),
    #050505;
}

.title{
    text-align:center;
    margin-bottom:30px;
}

.title h2{
    font-size:clamp(28px,4vw,44px);
    text-transform:uppercase;
    letter-spacing:3px;
}

.title h2 span{
    color:var(--gold);
}

.title p{
    margin-top:8px;
    color:#999;
    font-size:9px;
    letter-spacing:4px;
}

/* ================= WORLDS ================= */

.worlds{
    max-width:1270px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
}

.world{
    height:245px;
    border:1px solid rgba(244,181,28,.45);
    border-radius:7px;
    overflow:hidden;
    position:relative;
    background:#111;
    transition:.35s;
}

.world:hover{
    transform:translateY(-7px);
    border-color:var(--gold);
    box-shadow:0 15px 35px rgba(0,0,0,.7);
}

.world-bg{
    position:absolute;
    inset:0;
    background-size:cover;
    background-position:center;
}

.world-bg:after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(0deg,#000,transparent 70%);
}

.event{
    background-image:url("https://images.bhaskarassets.com/web2images/1884/2025/08/16/pant-7_1755364337.png");
}

.academy{
    background-image:url("https://cdn.nemzetisport.hu/2024/03/zoxMzhDLLFiJfv0jsBzRF6omrelbe_nCEG743kDZ7Zw/fill/1347/758/no/1/aHR0cHM6Ly9jbXNjZG4uYXBwLmNvbnRlbnQucHJpdmF0ZS9jb250ZW50LzZhNDQ5NmNkMTAxMTRlZTc5MmFmZjZmZWRlOWFlNmNh.webp");
}

.adventure{
    background-image:url("https://www.pelago.com/img/products/IN-India/72-hours-jungle-survival-learn-to-thrive/f201a080-4a4e-41bb-9329-94e8f49f7e91_72-hours-jungle-survival-learn-to-thrive-xlarge.jpg");
}

.tours{
    background-image:url("https://storage.justwravel.com/listing-seo/original/cropped/-JustWravel-1734446141-buran-ghati-trek-JustWravel-1720683139-bhuran-ghati4.png.webp");
}

.media{
    background-image:url("https://dt7v1i9vyp3mf.cloudfront.net/styles/news_large/s3/imagelibrary/L/Laura_03-PRVWJRPFVb_jLQtRuUUW10BvPTa990eg.jpg");
}

.world-info{
    position:absolute;
    z-index:2;
    left:10px;
    right:10px;
    bottom:12px;
    text-align:center;
}

.world-info h3{
    font-size:16px;
}

.world-info p{
    font-size:8px;
    color:#ccc;
    margin:6px 0 10px;
    letter-spacing:1px;
}

.mini{
    display:inline-block;
    padding:7px 17px;
    border:1px solid var(--gold);
    border-radius:20px;
    font-size:9px;
}

.mini:hover{
    background:var(--gold);
    color:#000;
}

/* ================= MOVEMENT ================= */

.movement{
    min-height:290px;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    background-image:
        linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.75)),
        url("https://static.justwravel.com/images/cgnfe1hd/production/18d6ab89f240f7d2b1f0ab71191b422eccd27f3a-938x850.webp?fm=webp");
    background-size:cover;
    background-position:center;
    border-top:1px solid rgba(244,181,28,.4);
    border-bottom:1px solid rgba(244,181,28,.4);
}

.movement-content{
    padding:20px;
}

.movement-small{
    font-size:17px;
    letter-spacing:2px;
}

.movement h2{
    font-size:clamp(42px,6vw,72px);
    line-height:1;
    margin:7px 0 12px;
}

.movement h2 span{
    color:var(--gold);
}

.movement p{
    color:#ddd;
    font-size:9px;
    letter-spacing:3px;
}

.watch{
    display:inline-flex;
    align-items:center;
    gap:10px;
    margin-top:20px;
    font-size:10px;
    font-weight:bold;
}

.play{
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid var(--gold);
    border-radius:50%;
    color:var(--gold);
}

/* ================= HIGHLIGHTS ================= */

.highlight-grid{
    max-width:1270px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
}

.highlight{
    height:175px;
    position:relative;
    overflow:hidden;
    border:1px solid rgba(244,181,28,.45);
    border-radius:6px;
}

.highlight-bg{
    position:absolute;
    inset:0;
    background-size:cover;
    background-position:center;
}

.highlight-bg:after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(0deg,#000,transparent 70%);
}

.afth{
    background-image:url("https://media.bolatimes.com/thumbs/2022/06/24/84897-timnas-india/730x480-img-84897-timnas-india.jpg");
}

.kashmir{
    background-image:url("https://www.nathanhortonphotography.com/wp-content/uploads/2023/01/Kashmir.jpg");
}

.nature{
    background-image:url("https://www.pelago.com/img/products/IN-India/72-hours-jungle-survival-learn-to-thrive/f201a080-4a4e-41bb-9329-94e8f49f7e91_72-hours-jungle-survival-learn-to-thrive-xlarge.jpg");
}

.songs{
    background-image:url("https://dt7v1i9vyp3mf.cloudfront.net/styles/news_large/s3/imagelibrary/L/Laura_03-PRVWJRPFVb_jLQtRuUUW10BvPTa990eg.jpg");
}

.films{
    background-image:url("https://images.squarespace-cdn.com/content/v1/61293ed44bb2be424728402e/1655543945581-VVKJ4FP9BS860I7ZP2RT/ARC-Green-Production-Services-reduced-v2.jpeg");
}

.highlight-play{
    position:absolute;
    z-index:3;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:34px;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #fff;
    border-radius:50%;
}

.highlight-info{
    position:absolute;
    z-index:4;
    left:10px;
    right:10px;
    bottom:10px;
    text-align:center;
}

.highlight-info h3{
    font-size:13px;
}

.highlight-info p{
    font-size:8px;
    color:var(--gold);
    margin-top:5px;
}

/* ================= BIG BANNER ================= */

.bigger{
    min-height:280px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background-image:
        linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.75)),
        url("https://storage.justwravel.com/listing-seo/original/cropped/-JustWravel-1734446141-buran-ghati-trek-JustWravel-1720683139-bhuran-ghati4.png.webp");
    background-size:cover;
    background-position:center;
    border-top:1px solid rgba(244,181,28,.4);
    border-bottom:1px solid rgba(244,181,28,.4);
}

.bigger h2{
    font-size:clamp(34px,5vw,62px);
    line-height:1;
}

.bigger h2 span{
    color:var(--gold);
}

.bigger p{
    color:#ddd;
    font-size:9px;
    letter-spacing:3px;
    margin:12px 0;
}

/* ================= STORIES ================= */

.story-grid{
    max-width:1270px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
}

.story{
    height:210px;
    position:relative;
    overflow:hidden;
    border:1px solid rgba(244,181,28,.4);
    border-radius:6px;
}

.story-bg{
    position:absolute;
    inset:0;
    background-size:cover;
    background-position:center;
}

.story-bg:after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(0deg,#000,transparent 70%);
}

.story1{
    background-image:url("https://images.bhaskarassets.com/web2images/1884/2025/08/16/pant-7_1755364337.png");
}

.story2{
    background-image:url("https://www.yhaindia.org/assets/images/hero-img2-trimmed.jpg");
}

.story3{
    background-image:url("https://www.pelago.com/img/products/IN-India/72-hours-jungle-survival-learn-to-thrive/f201a080-4a4e-41bb-9329-94e8f49f7e91_72-hours-jungle-survival-learn-to-thrive-xlarge.jpg");
}

.story4{
    background-image:url("https://media.bolatimes.com/thumbs/2022/06/24/84897-timnas-india/730x480-img-84897-timnas-india.jpg");
}

.story5{
    background-image:url("https://images.squarespace-cdn.com/content/v1/61293ed44bb2be424728402e/1655543945581-VVKJ4FP9BS860I7ZP2RT/ARC-Green-Production-Services-reduced-v2.jpeg");
}

.story-play{
    position:absolute;
    z-index:3;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:36px;
    height:36px;
    border:1px solid #fff;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
}

.story-info{
    position:absolute;
    z-index:4;
    bottom:10px;
    left:10px;
    right:10px;
    text-align:center;
}

.story-info p{
    font-size:9px;
    font-style:italic;
}

.story-info small{
    color:var(--gold);
    font-size:8px;
}

/* ================= PARTNERS ================= */

.partners{
    background:#050505;
}

.partner-grid{
    max-width:1100px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
}

.partner{
    height:90px;
    background:#fff;
    color:#333;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-weight:bold;
    font-size:12px;
}

/* ================= FOOTER ================= */

.footer{
    background:#020202;
    border-top:1px solid rgba(244,181,28,.4);
    padding:45px 20px 15px;
}

.footer-grid{
    max-width:1250px;
    margin:auto;
    display:grid;
    grid-template-columns:1.2fr 1.4fr 1fr 1.2fr;
    gap:30px;
}

.footer-title{
    color:var(--gold);
    font-size:11px;
    letter-spacing:2px;
    margin-bottom:15px;
}

.footer p,
.footer-contact{
    font-size:10px;
    line-height:1.7;
    color:#aaa;
}

.footer-contact{
    margin-bottom:9px;
}

.footer-social{
    display:flex;
    gap:8px;
}

.footer-social a{
    width:34px;
    height:34px;
    background:#fff;
    color:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:6px;
    font-weight:bold;
}

.footer-note{
    color:var(--gold);
    font-family:cursive;
    font-size:24px;
    font-style:italic;
    transform:rotate(-4deg);
    margin-top:15px;
}

.copyright{
    max-width:1250px;
    margin:25px auto 0;
    padding-top:15px;
    border-top:1px solid #222;
    display:flex;
    justify-content:space-between;
    color:#666;
    font-size:8px;
}

/* ================= TOP ================= */

.top{
    position:fixed;
    right:18px;
    bottom:18px;
    width:40px;
    height:40px;
    border-radius:50%;
    border:1px solid var(--gold);
    background:#050505;
    color:var(--gold);
    cursor:pointer;
    z-index:999;
    display:none;
}

/* ================= REVEAL ================= */

.reveal{
    opacity:0;
    transform:translateY(25px);
    transition:.7s;
}

.reveal.show{
    opacity:1;
    transform:translateY(0);
}

/* ================= TABLET ================= */

@media(max-width:1100px){

    .header-contact{
        display:none;
    }

    .nav a{
        padding:9px 7px;
        font-size:9px;
    }

    .worlds,
    .highlight-grid,
    .story-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .partner-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .footer-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

/* ================= MOBILE ================= */

@media(max-width:750px){

    .header{
        height:64px;
    }

    .header-inner{
        width:94%;
    }

    .menu{
        display:block;
    }

    .nav{
        display:none;
        position:absolute;
        top:64px;
        left:0;
        width:100%;
        background:#050505;
        border-bottom:1px solid var(--gold);
        flex-direction:column;
        padding:8px 0;
    }

    .nav.open{
        display:flex;
    }

    .nav a{
        width:100%;
        text-align:center;
        padding:13px;
        font-size:11px;
    }

    .hero{
        margin-top:64px;
        height:560px;
        min-height:560px;
    }

    .hero-content{
        align-items:flex-end;
        padding-bottom:65px;
    }

    .hero h1{
        font-size:48px;
    }

    .hero-text p{
        font-size:13px;
        max-width:320px;
    }

    .stats-inner{
        grid-template-columns:repeat(2,1fr);
    }

    .stat{
        min-height:85px;
    }

    .stat:last-child{
        grid-column:span 2;
    }

    .section{
        padding:40px 14px;
    }

    .worlds,
    .highlight-grid,
    .story-grid{
        display:flex;
        overflow-x:auto;
        scrollbar-width:none;
    }

    .worlds::-webkit-scrollbar,
    .highlight-grid::-webkit-scrollbar,
